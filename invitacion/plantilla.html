<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cumpleaños de Anahí</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#c9d0d8}
#wrap{width:100vw;max-width:1044px;margin:auto;aspect-ratio:696/1309;position:relative}

.serif{font-family:'Cormorant Garamond',serif;font-weight:500;letter-spacing:.3px}

.p small{font-size:7px;letter-spacing:1.5px}.p b{font-size:11px;font-weight:500;margin:2px 0}.p i{display:block;width:70px;border-top:1px solid #bbb;margin:8px 0}

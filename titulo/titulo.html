<text x="800" y="810" text-anchor="middle" font-family="Lora" font-style="italic" font-size="30" fill="#7a6a58">— tira cómica en cinco viñetas —</text>

<script>
const N='http://www.w3.org/2000/svg';
let s=11;const r=()=>{s=(s*9301+49297)%233280;return s/233280};
const g=document.getElementById('snow');
for(let i=0;i<130;i++){const x=70+r()*1460,y=110+r()*620;if(y>190&&y<720&&x>330&&x<1270&&r()>.12)continue;
 if(r()<.25){const u=document.createElementNS(N,'use');u.setAttribute('href','#flake');u.setAttribute('transform',`translate(${x} ${y}) scale(${.6+r()*.7})`);u.setAttribute('opacity','.9');g.appendChild(u);u.style.filter='drop-shadow(0 0 1px #b8a88a)';}
 else{const c=document.createElementNS(N,'circle');c.setAttribute('cx',x);c.setAttribute('cy',y);c.setAttribute('r',1.5+r()*3);c.setAttribute('fill','#fff');c.setAttribute('stroke','#d8ccb4');c.setAttribute('stroke-width','.8');g.appendChild(c)}}
// bulbs along wire
const w=document.getElementById('wire'),L=w.getTotalLength(),B=document.getElementById('bulbs');
const cols=['#d9504b','#e3b54a','#5f9a4a','#f2a9b9','#6fa3c9'];
for(let i=1;i<22;i++){const p=w.getPointAtLength(L*i/22),q=w.getPointAtLength(L*i/22+1);const a=Math.atan2(q.y-p.y,q.x-p.x)*180/Math.PI;const c=cols[i%cols.length];
 const gg=document.createElementNS(N,'g');gg.setAttribute('transform',`translate(${p.x} ${p.y}) rotate(${a*0.3})`);
 const mk=(t,a)=>{const e=document.createElementNS(N,t);for(const k in a)e.setAttribute(k,a[k]);gg.appendChild(e)};
 mk('circle',{cx:0,cy:22,r:16,fill:c,opacity:.45,filter:'url(#glow)'});
 mk('rect',{x:-5,y:0,width:10,height:9,rx:2,fill:'#5a4a3a',stroke:'#3a2a22','stroke-width':2});
 mk('path',{d:'M0 8 C -11 12 -10 30 0 34 C 10 30 11 12 0 8Z',fill:c,stroke:'#3a2a22','stroke-width':2.5});
 mk('path',{d:'M-3 14 Q-6 20 -3 26',stroke:'#fff','stroke-width':2,fill:'none',opacity:.7,'stroke-linecap':'round'});
 B.appendChild(gg);}
</script>

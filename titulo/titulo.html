<!doctype html>

<script>

for(let i=0;i<120;i++){const x=70+r()*1460,y=80+r()*660;const inTitle=y>200&&y<660&&x>380&&x<1220;if(inTitle&&r()>.15)continue;const c=document.createElementNS(N,'circle');c.setAttribute('cx',x);c.setAttribute('cy',y);c.setAttribute('r',1.5+r()*3.5);c.setAttribute('fill','#fff');c.setAttribute('stroke','#d8ccb4');c.setAttribute('stroke-width','.8');g.appendChild(c)}

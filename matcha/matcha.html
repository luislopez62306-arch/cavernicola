<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Sacramento&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#fbf6ea}
svg{display:block}
.ink{stroke:#3d3b2f;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;filter:url(#wob)}
.thin{stroke:#3d3b2f;stroke-width:2;fill:none;stroke-linecap:round;filter:url(#wob)}
.t{font-family:'Caveat',cursive;fill:#4f5a2a}
.h{font-family:'Caveat',cursive;font-weight:700;fill:#5f7a2e;font-size:50px}
.h,.p{paint-order:stroke;stroke:#fbf6ea;stroke-width:9px;stroke-linejoin:round}
.p{font-family:'Caveat',cursive;font-weight:500;fill:#4a4636;font-size:29px}
.n{font-family:'Caveat',cursive;font-weight:700;fill:#fff;font-size:38px}
</style></head><body>
<svg width="1200" height="1700" viewBox="0 0 1200 1700" xmlns="http://www.w3.org/2000/svg">
<defs>
  <filter id="wob"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="3.5"/></filter>
  <filter id="paper"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="2"/><feColorMatrix values="0 0 0 0 0.45 0 0 0 0 0.42 0 0 0 0 0.3 0 0 0 0.07 0"/></filter>
  <g id="leaf"><path d="M0 0 C 20 -30 60 -30 80 0 C 60 30 20 30 0 0Z" fill="#c9d6a3" opacity=".55"/><path d="M5 0 L75 0" stroke="#b5c48a" stroke-width="2" opacity=".6"/></g>
  <g id="heart"><path d="M0 8 C -14 -6 -6 -18 0 -9 C 6 -18 14 -6 0 8Z" fill="#f2b9c8" stroke="#3d3b2f" stroke-width="1.5" filter="url(#wob)"/></g>
  <g id="spark"><path d="M0 -14 Q2 -2 14 0 Q2 2 0 14 Q-2 2 -14 0 Q-2 -2 0 -14Z" fill="#f6d77d" stroke="#3d3b2f" stroke-width="1.5" filter="url(#wob)"/></g>
</defs>
<rect width="1200" height="1700" fill="#fbf6ea"/>
<rect width="1200" height="1700" filter="url(#paper)"/>

<!-- background leaves -->
<g opacity=".9">
<use href="#leaf" transform="translate(60 120) rotate(-30) scale(1.6)"/>
<use href="#leaf" transform="translate(1020 260) rotate(200) scale(1.4)"/>
<use href="#leaf" transform="translate(40 820) rotate(20) scale(1.3)"/>
<use href="#leaf" transform="translate(1130 980) rotate(160) scale(1.6)"/>
<use href="#leaf" transform="translate(120 1520) rotate(-60) scale(1.2)"/>
<use href="#leaf" transform="translate(1080 1600) rotate(220) scale(1.2)"/>
<use href="#leaf" transform="translate(620 640) rotate(40) scale(1)"/>
</g>

<!-- Title -->
<text x="140" y="215" font-family="Sacramento" font-size="210" fill="#7c9a3d" class="ink" style="stroke-width:1.5">Matcha</text>
<text x="790" y="300" font-family="Caveat" font-weight="700" font-size="110" fill="#e69bb0" transform="rotate(-6 790 300)" class="ink" style="stroke-width:1.5">Latte</text>
<text x="160" y="320" class="p" style="font-size:34px">paso a paso para preparar un matcha ♡</text>
<g transform="translate(1000 130)"><use href="#heart" transform="scale(2.2)"/></g>
<g transform="translate(1080 90)"><use href="#heart" transform="scale(1.3) rotate(15)"/></g>
<use href="#spark" transform="translate(110 90)"/>

<!-- winding path (pink ribbon) -->
<path d="M260 470 C 600 430 900 470 900 600 C 900 760 300 700 300 860 C 300 1010 900 960 900 1120 C 900 1280 300 1250 300 1420 C 300 1520 600 1560 820 1540"
  fill="none" stroke="#f2c4cf" stroke-width="34" stroke-linecap="round" class="" filter="url(#wob)"/>
<path d="M260 470 C 600 430 900 470 900 600 C 900 760 300 700 300 860 C 300 1010 900 960 900 1120 C 900 1280 300 1250 300 1420 C 300 1520 600 1560 820 1540"
  fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="14 14" filter="url(#wob)"/>

<!-- ===== STEP 1: Prepara ===== -->
<g transform="translate(70 340)">
  <ellipse cx="190" cy="215" rx="185" ry="34" fill="#dfe8c4" class="ink"/>
  <!-- tin -->
  <rect x="40" y="70" width="95" height="140" rx="8" fill="#9bb35a" class="ink"/>
  <rect x="34" y="55" width="107" height="26" rx="6" fill="#c9d6a3" class="ink"/>
  <rect x="55" y="110" width="65" height="60" rx="6" fill="#fbeef1" class="ink"/>
  <text x="62" y="148" class="t" font-size="22" font-weight="700">抹茶</text>
  <!-- chasen -->
  <path d="M175 210 L170 140 Q195 120 220 140 L215 210Z" fill="#f3e2b3" class="ink"/>
  <path d="M178 145 L183 205 M190 140 L192 207 M202 140 L200 207 M213 145 L208 205" class="thin"/>
  <rect x="178" y="95" width="34" height="48" rx="6" fill="#e8cf8f" class="ink"/>
  <!-- milk -->
  <path d="M260 90 L330 90 L330 210 L260 210Z" fill="#fbeef1" class="ink"/>
  <path d="M260 90 L275 60 L315 60 L330 90" fill="#f2c4cf" class="ink"/>
  <text x="268" y="160" class="t" font-size="28" font-weight="700" fill="#d27b95">leche</text>
</g>
<g transform="translate(470 370)">
  <circle cx="0" cy="0" r="26" fill="#e69bb0" class="ink" style="stroke-width:2"/><text x="-8" y="12" class="n">1</text>
  <text x="40" y="14" class="h">Prepara</text>
  <text x="0" y="60" class="p">Ten listo el matcha, el batidor</text>
  <text x="0" y="92" class="p">(chasen), un bol y tu leche favorita.</text>
</g>

<!-- ===== STEP 2: Tamiza ===== -->
<g transform="translate(700 600)">
  <ellipse cx="180" cy="200" rx="170" ry="30" fill="#dfe8c4" class="ink"/>
  <!-- bowl -->
  <path d="M60 120 Q180 260 300 120Z" fill="#f6dbe2" class="ink"/>
  <ellipse cx="180" cy="120" rx="120" ry="22" fill="#fbeef1" class="ink"/>
  <ellipse cx="180" cy="122" rx="60" ry="10" fill="#8fae4a" filter="url(#wob)"/>
  <!-- sieve -->
  <ellipse cx="180" cy="40" rx="60" ry="14" fill="#e6e3d6" class="ink"/>
  <path d="M120 40 Q180 95 240 40" fill="#f1efe6" class="ink"/>
  <path d="M240 40 L310 20" class="ink" fill="none" style="stroke-width:5"/>
  <g fill="#8fae4a"><circle cx="165" cy="85" r="3"/><circle cx="185" cy="95" r="2.5"/><circle cx="175" cy="105" r="3"/><circle cx="195" cy="82" r="2"/></g>
</g>
<g transform="translate(260 650)">
  <circle cx="0" cy="0" r="26" fill="#e69bb0" class="ink" style="stroke-width:2"/><text x="-9" y="12" class="n">2</text>
  <text x="40" y="14" class="h">Tamiza</text>
  <text x="0" y="60" class="p">Cierne 2 g (1 cdta) de matcha</text>
  <text x="0" y="92" class="p">en el bol para que no haga grumos.</text>
</g>

<!-- ===== STEP 3: Agua ===== -->
<g transform="translate(90 900)">
  <ellipse cx="180" cy="210" rx="175" ry="30" fill="#dfe8c4" class="ink"/>
  <!-- kettle -->
  <path d="M40 200 Q20 110 110 100 Q200 110 180 200Z" fill="#f6dbe2" class="ink"/>
  <path d="M175 160 Q230 130 250 90" fill="none" class="ink" style="stroke-width:9"/>
  <path d="M175 160 Q230 130 250 90" fill="none" stroke="#f6dbe2" stroke-width="4"/>
  <path d="M60 110 Q110 30 160 110" fill="none" class="ink" style="stroke-width:5"/>
  <ellipse cx="110" cy="100" rx="35" ry="8" fill="#e69bb0" class="ink"/>
  <path d="M255 85 Q265 60 255 40 Q245 20 260 0 M275 90 Q285 65 275 45" class="thin"/>
  <!-- thermometer bubble -->
  <rect x="270" y="120" width="90" height="46" rx="20" fill="#fff" class="ink" style="stroke-width:2"/>
  <text x="283" y="153" class="t" font-size="30" font-weight="700" fill="#d27b95">80°C</text>
</g>
<g transform="translate(560 960)">
  <circle cx="0" cy="0" r="26" fill="#e69bb0" class="ink" style="stroke-width:2"/><text x="-9" y="12" class="n">3</text>
  <text x="40" y="14" class="h">Añade agua</text>
  <text x="0" y="60" class="p">Vierte 60 ml de agua a 75–80 °C.</text>
  <text x="0" y="92" class="p">¡Nunca hirviendo, o amargará!</text>
</g>

<!-- ===== STEP 4: Bate ===== -->
<g transform="translate(700 1150)">
  <ellipse cx="180" cy="200" rx="170" ry="30" fill="#dfe8c4" class="ink"/>
  <path d="M60 120 Q180 260 300 120Z" fill="#f6dbe2" class="ink"/>
  <ellipse cx="180" cy="120" rx="120" ry="22" fill="#fbeef1" class="ink"/>
  <ellipse cx="180" cy="122" rx="105" ry="17" fill="#a9c260" filter="url(#wob)"/>
  <g fill="#e3edc4"><circle cx="150" cy="120" r="5"/><circle cx="200" cy="118" r="4"/><circle cx="175" cy="126" r="6"/><circle cx="225" cy="124" r="3"/></g>
  <!-- whisk tilted -->
  <g transform="rotate(18 200 60)">
    <path d="M185 120 L180 60 Q205 42 230 60 L225 120Z" fill="#f3e2b3" class="ink"/>
    <rect x="190" y="0" width="30" height="58" rx="6" fill="#e8cf8f" class="ink"/>
  </g>
  <path d="M40 40 L60 80 L80 45 L100 80 L120 40" class="thin" style="stroke:#d27b95;stroke-width:3"/>
</g>
<g transform="translate(260 1200)">
  <circle cx="0" cy="0" r="26" fill="#e69bb0" class="ink" style="stroke-width:2"/><text x="-9" y="12" class="n">4</text>
  <text x="40" y="14" class="h">Bate en “W”</text>
  <text x="0" y="60" class="p">Bate rápido en zigzag 20–30 seg</text>
  <text x="0" y="92" class="p">hasta que salga una espumita.</text>
</g>

<!-- ===== STEP 5 & 6: Leche + servir ===== -->
<g transform="translate(70 1400)">
  <ellipse cx="200" cy="250" rx="190" ry="30" fill="#dfe8c4" class="ink"/>
  <!-- glass with milk+ice -->
  <path d="M110 70 L290 70 L270 250 L130 250Z" fill="#fffaf0" class="ink"/>
  <path d="M120 150 L280 150 L270 250 L130 250Z" fill="#fbf3e6" filter="url(#wob)"/>
  <path d="M117 120 Q200 135 283 120 L280 150 Q200 160 120 150Z" fill="#a9c260" filter="url(#wob)"/>
  <rect x="140" y="160" width="40" height="36" rx="6" fill="#eef4f8" class="thin" transform="rotate(-10 160 178)"/>
  <rect x="200" y="175" width="40" height="36" rx="6" fill="#eef4f8" class="thin" transform="rotate(12 220 193)"/>
  <!-- straw & bow -->
  <path d="M235 75 L265 -20" stroke="#e69bb0" stroke-width="14" stroke-linecap="round" filter="url(#wob)"/>
  <path d="M248 40 Q205 0 215 55 Q240 60 248 40 Q290 15 290 60 Q265 65 248 40 M248 40 Q230 80 215 105 M248 40 Q265 85 280 100" fill="none" stroke="#e69bb0" stroke-width="7" stroke-linecap="round" filter="url(#wob)"/>
  <path d="M110 70 L290 70 L270 250 L130 250Z" fill="none" class="ink"/>
  <path d="M135 90 L145 230" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".8"/>
</g>
<use href="#spark" transform="translate(410 1440)"/>
<use href="#spark" transform="translate(60 1450) scale(.7)"/>
<use href="#heart" transform="translate(400 1530) scale(1.4)"/>

<g transform="translate(530 1395)">
  <circle cx="0" cy="0" r="26" fill="#e69bb0" class="ink" style="stroke-width:2"/><text x="-9" y="12" class="n">5</text>
  <text x="40" y="14" class="h">Leche y hielo</text>
  <text x="0" y="56" class="p">Llena un vaso con hielo y 180 ml de leche.</text>
</g>
<g transform="translate(530 1520)">
  <circle cx="0" cy="0" r="26" fill="#e69bb0" class="ink" style="stroke-width:2"/><text x="-9" y="12" class="n">6</text>
  <text x="40" y="14" class="h">Sirve y disfruta</text>
  <text x="0" y="56" class="p">Vierte el matcha encima, mira las capas</text>
  <text x="0" y="88" class="p">y endulza al gusto ♡</text>
</g>
<text x="600" y="1670" text-anchor="middle" class="p" style="font-size:26px;fill:#9a937a">matcha · matcha · matcha</text>
</svg>
</body></html>

<script>
const NS='http://www.w3.org/2000/svg';
const el=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);(p||document.getElementById('s')).appendChild(e);return e};
// background leaves
const L=document.getElementById('leaves');
[[-40,420,30,1.3],[900,330,-20,1.4],[700,820,60,1.1],[-60,1040,-15,1.5],[940,1380,200,1.2],[380,1520,-40,1.0],[460,700,150,.9],[1000,40,120,.9],[330,10,20,.8]]
.forEach(([x,y,r,s])=>{const g=el('g',{transform:`translate(${x} ${y}) rotate(${r}) scale(${s})`},L);el('use',{href:'#leafP'},g);el('path',{d:'M10 0 Q120 -6 230 0',stroke:'#4e6a2b','stroke-width':4,fill:'none'},g);for(let i=1;i<6;i++){const x0=i*38;el('path',{d:`M${x0} -2 Q${x0+25} -25 ${x0+40} -35 M${x0} 2 Q${x0+25} 25 ${x0+40} 35`,stroke:'#4e6a2b','stroke-width':2.5,fill:'none'},g)}});
// isometric slabs
const P=document.getElementById('plats');
function slab(x,y,w,dp,h){ // top: parallelogram skewed left
  const sk=dp*0.9;
  const top=`M${x+sk} ${y} L${x+w+sk} ${y} L${x+w} ${y+dp} L${x} ${y+dp}Z`;
  el('path',{d:`M${x} ${y+dp} L${x+w} ${y+dp} L${x+w} ${y+dp+h} L${x} ${y+dp+h}Z`,fill:'#c99aa5',stroke:'#2e2a20','stroke-width':2,'stroke-linejoin':'round',filter:'url(#hand)'},P);
  el('path',{d:`M${x+w} ${y+dp} L${x+w+sk} ${y} L${x+w+sk} ${y+h} L${x+w} ${y+dp+h}Z`,fill:'#ae7f8b',stroke:'#2e2a20','stroke-width':2,'stroke-linejoin':'round',filter:'url(#hand)'},P);
  el('path',{d:top,fill:'#f8e6ea',stroke:'#2e2a20','stroke-width':2,'stroke-linejoin':'round',filter:'url(#hand)'},P);
}
// connectors (bamboo-style pipes)
function pipe(d){el('path',{d,stroke:'#2e2a20','stroke-width':16,fill:'none','stroke-linecap':'round','stroke-linejoin':'round',filter:'url(#hand)'},P);el('path',{d,stroke:'#e3c98e','stroke-width':11,fill:'none','stroke-linecap':'round','stroke-linejoin':'round'},P);}
pipe('M560 470 L960 470 L960 610');
pipe('M780 780 L420 780 L420 880');
pipe('M560 1060 L960 1060 L960 1130');
pipe('M790 1300 L360 1300 L360 1380');
slab(30,470,500,70,34);
slab(690,750,420,60,30);
slab(50,1030,450,60,30);
slab(690,1270,420,60,30);
slab(-40,1530,1300,90,40);
// labels
const Lb=document.getElementById('labels');
function label(x,y,n,t,lines,anchor){
  const a=anchor||'start';
  const g=el('g',{},Lb);
  const cx=a==='end'?x-24:x+24;
  el('circle',{cx,cy:y-14,r:22,fill:'none',stroke:'#fdf3d8','stroke-width':2.5},g);
  const nt=el('text',{x:cx,y:y-6,'text-anchor':'middle',class:'num'},g);nt.textContent=n;
  const tt=el('text',{x:a==='end'?x-60:x+60,y,'text-anchor':a,class:'ttl'},g);tt.textContent=t;
  lines.forEach((l,i)=>{const tx=el('text',{x,y:y+38+i*27,'text-anchor':a,class:'txt'},g);tx.textContent=l;});
}
label(610,390,'1','Prepara',['Matcha de buena calidad, batidor','de bambú (chasen), un bol y leche.']);
label(560,670,'2','Tamiza',['Cierne 2 g (1 cdta) de matcha','en el bol para evitar grumos.'],'end');
label(1160,930,'3','Agua caliente',['Añade 60 ml de agua a 75–80 °C.','Nunca hirviendo: lo vuelve amargo.'],'end');
label(80,1180,'4','Bate en “W”',['Bate rápido en zigzag 20–30 seg','hasta lograr una espuma fina.']);
label(430,1400,'5','Leche y hielo',['Vaso con hielo y 180 ml de leche;','vierte el matcha encima.'],'start');
label(1160,1675,'6','Sirve y disfruta',[],'end');
const ft=el('text',{x:60,y:1675,class:'txt','font-size':20},Lb);ft.textContent='Endulza al gusto y disfruta las capas ♡';
</script>

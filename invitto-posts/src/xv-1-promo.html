<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300;1,9..144,400&family=Alex+Brush&family=DM+Sans:wght@400;500&display=block" rel="stylesheet"><style>
:root{--ch:#2E2C2A;--iv:#FAF5EC;--ivd:#F1E8DA;--g:#D9C29A;--gd:#86693E;--mu:#6E665C;--w:#5A1F2E}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;overflow:hidden;background:var(--iv);font-family:"DM Sans",sans-serif;color:var(--ch);position:relative}
.serif{font-family:Fraunces,Georgia,serif}.script{font-family:"Alex Brush",cursive;word-spacing:14px}
.frame{position:absolute;inset:36px;border:1.5px solid var(--g)}.frame2{position:absolute;inset:46px;border:1px solid rgba(217,194,154,.5)}
.brand{position:absolute;top:84px;left:96px;display:flex;align-items:baseline;gap:14px}
.brand b{font-family:Fraunces,serif;font-weight:400;font-size:34px;letter-spacing:1px}.brand span{font-size:17px;color:var(--mu);letter-spacing:1px}
.center{text-align:center}
</style></head><body><div class="frame"></div><div class="frame2"></div><div class="brand"><b>Invitto</b><span>@invitto.creastudio</span></div>
<style>
.kick{position:absolute;top:170px;width:100%;font-size:92px;color:var(--gd)}
.h{position:absolute;top:280px;width:100%;font-size:74px;line-height:1.05;font-weight:300}
.h i{color:var(--w)}
.sub{position:absolute;top:460px;width:100%;font-size:22px;letter-spacing:6px;text-transform:uppercase;color:var(--mu)}
.phone{position:absolute;top:540px;left:50%;transform:translateX(-50%);width:330px;height:620px;border-radius:52px;background:var(--ch);padding:14px;box-shadow:0 30px 60px rgba(46,44,42,.25)}

.notch{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:96px;height:26px;border-radius:14px;background:var(--ch)}
.foot{position:absolute;bottom:92px;width:100%;font-size:40px;font-weight:400}
.foot .dot{color:var(--g)}
</style>
<div class="kick script center">Mis XV años</div>

<rect x="86" y="460" width="130" height="40" rx="20" fill="#2E2C2A"/>

<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:1080px;height:1350px;overflow:hidden}

<style>body{background:radial-gradient(ellipse at 50% 40%,#74818E,#5E6B78 55%,#4A5560);position:relative;color:var(--iv)}

.label{position:absolute;top:66px;right:64px;font-family:'DM Sans';font-size:17px;letter-spacing:4px;text-transform:uppercase;border:1px solid var(--g);color:var(--g);padding:10px 20px;border-radius:30px}
svg{position:absolute;left:90px;top:170px}
.txt{position:absolute;left:0;right:0;top:170px;height:960px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#3A3836}
.std{font-family:Fraunces;font-weight:500;letter-spacing:12px;font-size:40px;color:var(--gd)}
.names{font-family:'Alex Brush';font-size:132px;line-height:1.1;margin:26px 0 14px;color:var(--ch)}
.date{font-family:Fraunces;font-weight:300;font-size:46px;letter-spacing:8px}
.small{font-family:'DM Sans';font-size:19px;letter-spacing:5px;color:var(--mu);margin-top:26px;text-transform:uppercase}
.foot{position:absolute;bottom:60px;left:0;right:0;text-align:center;font-family:'DM Sans';font-size:24px;letter-spacing:2px;color:var(--iv)}.foot i{color:var(--g);font-style:normal}

<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Great+Vibes&family=Poppins:wght@500;600&family=Bodoni+Moda:opsz,wght@6..96,400&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
:root{--rosa:#E8789B;--rosa2:#F7C9D6;--beige:#E5DACC;--crema:#FBF7F1}
body{margin:0;background:#ddd;display:flex;gap:30px;padding:30px;flex-wrap:wrap}
.s{width:1080px;height:1350px;position:relative;overflow:hidden;font-family:'Poppins'}
.bg{position:absolute;inset:0;background-size:cover;background-position:center}
.glow{text-shadow:0 2px 16px rgba(0,0,0,.25)}
.pill{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:20px;background:rgba(255,255,255,.95);border-radius:28px;padding:24px 56px;font-weight:600;font-size:42px;letter-spacing:-.01em;box-shadow:0 6px 20px rgba(60,20,30,.14)}
.pill img{width:70px;height:70px;border-radius:50%}
.emo{position:absolute;font-size:70px}
.bub{position:absolute;background:#FFF1BF;color:var(--rosa);font-weight:600;font-size:34px;padding:16px 40px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.1)}
.pola{position:absolute;background:#fff;padding:26px 26px 100px;box-shadow:0 18px 40px rgba(0,0,0,.32)}
.pola div{width:100%;height:100%;background-size:cover;background-position:center}
.stripes{background:repeating-linear-gradient(90deg,var(--crema) 0 92px,var(--beige) 92px 184px)}
.stamp{position:absolute;background:#fff;padding:24px;box-shadow:0 14px 34px rgba(80,50,40,.22);-webkit-mask:linear-gradient(#000 0 0) content-box,radial-gradient(circle 10px,transparent 9.5px,#000 10px) -14px -14px/28px 28px}
.stamp div{width:100%;height:100%;background-size:cover;background-position:center}
.doodle{position:absolute;fill:none;stroke:var(--rosa);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.star{position:absolute;color:#F4A9C0;font-size:44px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.12))}
</style></head><body>

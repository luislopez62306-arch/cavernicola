<!doctype html><html lang="es"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Great+Vibes&family=Poppins:wght@500;600&family=Bodoni+Moda:opsz,wght@6..96,400&family=Instrument+Serif&family=Fredoka:wght@700&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--rosa:#E8789B;--rosa2:#F7C9D6;--beige:#E5DACC;--crema:#FBF7F1}
body{margin:0;background:#ddd;display:flex;gap:30px;padding:30px;flex-wrap:wrap}
.s{width:1080px;height:1350px;position:relative;overflow:hidden;font-family:'Poppins'}
.bg{position:absolute;inset:0;background-size:cover;background-position:center}
.glow{text-shadow:0 2px 16px rgba(0,0,0,.25)}
.pill{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:20px;background:rgba(255,255,255,.95);border-radius:28px;padding:24px 56px;font-weight:600;font-size:42px;letter-spacing:-.01em;box-shadow:0 6px 20px rgba(60,20,30,.14)}
.pill img{width:70px;height:70px;border-radius:50%}
.emo{position:absolute;font-size:70px}
.bub{position:absolute;background:#FFF1BF;color:var(--rosa);font-weight:600;font-size:34px;padding:16px 40px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.1)}
.pola{position:absolute;background:#fff;padding:26px 26px 100px;box-shadow:0 18px 40px rgba(0,0,0,.32)}
.pola div{width:100%;height:100%;background-size:cover;background-position:center}
.stripes{background:repeating-linear-gradient(90deg,var(--crema) 0 92px,var(--beige) 92px 184px)}
.stamp{position:absolute;background:#fff;padding:24px;box-shadow:0 14px 34px rgba(80,50,40,.22);-webkit-mask:linear-gradient(#000 0 0) content-box,radial-gradient(circle 10px,transparent 9.5px,#000 10px) -14px -14px/28px 28px}
.stamp div{width:100%;height:100%;background-size:cover;background-position:center}
.doodle{position:absolute;fill:none;stroke:var(--rosa);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.star{position:absolute;color:#F4A9C0;font-size:44px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.12))}
.notif{position:absolute;background:rgba(245,245,247,.96);border-radius:26px;box-shadow:0 10px 26px rgba(0,0,0,.18);padding:22px 28px;font-family:Inter}
.notif .app{display:flex;align-items:center;gap:12px;font-size:20px;color:#8a8a8e;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.notif .app img{width:40px;height:40px;border-radius:10px}
.notif b{display:block;margin-top:10px;font-size:30px;color:#111}
.notif span{display:block;font-size:26px;color:#333;margin-top:4px}
.gl{position:absolute;padding:16px 42px 24px;font-family:Fredoka;font-weight:700;color:#D2447C;background:repeating-linear-gradient(0deg,rgba(255,255,255,.35) 0 6px,transparent 6px 12px),repeating-linear-gradient(90deg,rgba(255,255,255,.35) 0 6px,transparent 6px 12px),#F5BFD3;clip-path:polygon(1% 6%,30% 0,62% 5%,99% 1%,100% 70%,97% 100%,55% 95%,20% 100%,0 94%)}
</style></head><body>
<svg width="0" height="0" style="position:absolute">
 <symbol id="pastel" viewBox="0 0 200 230"><path d="M30 220h140M44 220v-56h112v56M58 164v-42h84v42M100 122v-36M100 86q-7-14 0-24q7 10 0 24M44 190q14 12 28 0t28 0 28 0 28 0M58 144q10 9 21 0t21 0 21 0 21 0"/><path d="M100 104q-46-34-54-6q-6 24 54 6zM100 104q46-34 54-6q6 24-54 6zM95 106q-16 34-30 56M105 106q16 34 30 56"/></symbol>
 <symbol id="corazon" viewBox="0 0 100 90"><path d="M50 82C10 52 4 30 18 16c12-12 28-6 32 8c4-14 20-20 32-8c14 14 8 36-32 66z"/></symbol>
 <symbol id="corazon2" viewBox="0 0 100 90"><path d="M50 80C14 52 8 32 20 18c10-10 26-6 30 8c4-14 20-18 30-8c12 14 6 34-30 62zM60 30q8-6 14 2"/></symbol>
</svg>


<!-- A · XV teléfono: polaroid + burbujas -->
<section class="s"><div class="bg" style="background-image:url(fotos/xv-fondo.jpg);transform:scale(1.1)"></div>
 <div class="bg" style="background:rgba(255,240,244,.18)"></div>
 <div class="glow" style="position:absolute;left:0;right:0;top:90px;text-align:center;color:#fff;font-family:'Pinyon Script';font-size:140px">¿Bueno?</div>
 <div class="pola" style="left:110px;top:300px;width:640px;height:600px;transform:rotate(-3deg)"><div style="background-image:url(fotos/xv-telefono.jpg);background-position:center top"></div></div>
 <div class="bub" style="right:70px;top:430px;color:#D2447C">Te hablo para invitarte</div>
 <div class="bub" style="right:70px;top:525px;color:#D2447C">a mis XV 💗</div>
 <div class="bub" style="left:90px;top:1080px;background:#fff;color:#A88472;border-radius:999px">¡Ya aparté la fecha! 📅</div>
 <div class="emo" style="right:110px;top:1060px;font-size:64px">☎️🎀</div>
</section>

<!-- B · Bridesmaids: rayas + estampilla -->
<section class="s stripes">
 <div class="gl" style="left:80px;top:110px;font-size:88px;transform:rotate(-3deg)">the bridesmaids</div>
 <div class="glow" style="position:absolute;right:90px;top:250px;color:#E8789B;font-family:'Great Vibes';font-size:110px;text-shadow:none;transform:rotate(-5deg)">said yes</div>
 <div class="stamp" style="left:50px;top:420px;width:980px;height:640px;transform:rotate(2deg)"><div style="background-image:url(fotos/damas.jpg)"></div></div>
 <div class="pill" style="bottom:110px;color:var(--rosa);font-size:38px"><img src="fotos/logo.jpg">El Picnic de Francia</div>
 <svg class="doodle" style="left:880px;top:90px;width:130px;height:120px"><use href="#corazon2"/></svg>
 <div class="star" style="left:60px;top:330px">★</div><div class="star" style="right:70px;top:1110px">★</div><div class="star" style="left:520px;top:370px">★</div>
</section>

<!-- C · Es mi cumple: foto completa + notificación -->
<section class="s"><div class="bg" style="background-image:url(fotos/es-mi-cumple.jpg);background-position:center 70%"></div>
 <div class="bg" style="background:linear-gradient(0deg,rgba(0,0,0,.55),transparent 35%)"></div>
 <div class="glow" style="position:absolute;left:80px;bottom:110px;color:#fff;font-family:'Instrument Serif';font-size:120px;line-height:.82;letter-spacing:-.03em">every detail <span style="font-size:70px;vertical-align:36px">✦</span><br><span style="padding-left:110px">has her name</span></div>
 <div class="notif" style="right:50px;top:70px;width:520px;transform:rotate(2deg)"><div class="app"><img src="fotos/logo.jpg">El Picnic de Francia · ahora</div><b>Tu mesa está lista 🎀</b><span>Con tu nombre en cada lugar.</span></div>
</section>
</body></html>

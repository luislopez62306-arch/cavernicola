<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Limelight&family=Poiret+One&family=Cormorant+Garamond:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1350px;background:#0F3D3E;overflow:hidden;position:relative;font-family:'Poiret One',sans-serif;color:#F3E9D2}
svg.bg{position:absolute;inset:0}
.txt{position:absolute;left:0;right:0;text-align:center}
.top{top:150px;font-size:30px;letter-spacing:.45em;color:#C9A227;font-weight:700}
.title{top:610px;font-family:'Limelight',serif;font-size:132px;line-height:1;color:#F3E9D2;letter-spacing:.04em}
.title span{display:block;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:64px;color:#C9A227;margin:14px 0}
.date{top:1050px;font-size:38px;letter-spacing:.35em;font-weight:700}
.place{top:1115px;font-size:26px;letter-spacing:.3em;color:#C9A227}
.grain{position:absolute;inset:0;opacity:.12;mix-blend-mode:overlay}
</style></head><body>

 </g>

 <g fill="url(#g)"><rect x="240" y="1018" width="250" height="2"/><rect x="590" y="1018" width="250" height="2"/><path d="M540 1004l16 15-16 15-16-15z"/></g>
 <g fill="url(#g)"><rect x="240" y="198" width="600" height="2"/></g>

</svg>

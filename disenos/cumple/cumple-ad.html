<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;1,6..96,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Pinyon+Script&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1350px;overflow:hidden;position:relative;background:#F3ECE6;color:#5a1018;font-family:'Bricolage Grotesque'}
.a{position:absolute}
.logo{left:80px;top:70px;font-family:'Pinyon Script';font-size:80px;line-height:1}

.feat{left:80px;top:720px;width:500px;display:flex;flex-wrap:wrap;gap:12px}

.cta{left:80px;bottom:95px;display:flex;flex-direction:column;align-items:flex-start;gap:10px}

.arch{right:-90px;top:130px;width:620px;height:1000px;background:#5a1018;border-radius:310px 310px 0 0}
.arch2{right:-60px;top:160px;width:560px;height:970px;border:2px solid #ecc3c6;border-radius:280px 280px 0 0;opacity:.6}
.phone{right:90px;top:200px;width:400px;height:840px;border-radius:60px;background:#1a0b0e;padding:13px;transform:rotate(4deg);box-shadow:0 40px 70px -20px rgba(40,5,10,.7)}
.phone img{width:100%;height:100%;object-fit:cover;object-position:top;border-radius:48px;display:block}
.notch{left:50%;top:28px;width:110px;height:32px;background:#1a0b0e;border-radius:20px;transform:translateX(-50%)}
.card{border-radius:22px;overflow:hidden;box-shadow:0 25px 45px -18px rgba(40,5,10,.6)}
.card img{display:block;width:100%}
.sticker{right:30px;top:90px;width:190px;height:190px;border-radius:50%;background:#ecc3c6;color:#5a1018;display:flex;align-items:center;justify-content:center;text-align:center;transform:rotate(-12deg);font-family:'Bodoni Moda';font-style:italic;font-size:36px;line-height:1;box-shadow:0 10px 20px -8px rgba(0,0,0,.35)}
.sticker b{font-family:'Bricolage Grotesque';font-style:normal;font-weight:800;font-size:19px;letter-spacing:.12em;display:block;margin-top:8px}
.grain{inset:0;opacity:.08;mix-blend-mode:multiply;pointer-events:none}

<div class="a card" style="right:40px;top:930px;width:330px;transform:rotate(-5deg)"><img src="count.jpg"></div>

<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Pinyon+Script&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>*{margin:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;position:relative;background:#F4ECDC;color:#46161d}
.logo{position:absolute;left:0;right:0;top:230px;text-align:center;font-family:'Pinyon Script';font-size:92px;line-height:1}
.logo small{font-family:'Bricolage Grotesque';font-size:19px;letter-spacing:.4em;display:block;margin-top:4px;color:#7a4a52}
.h{position:absolute;left:0;right:0;top:410px;text-align:center;font-family:'Bricolage Grotesque';font-weight:800;font-size:150px;line-height:.9;letter-spacing:-.045em}
.h em{font-family:'Instrument Serif';font-weight:400;font-style:italic;letter-spacing:-.01em;color:#8c2f3c}
.h .hl{background:linear-gradient(transparent 60%,#b3c6d6 60%,#b3c6d6 92%,transparent 92%)}
.arch{position:absolute;left:150px;right:150px;top:740px;height:860px;background:#b3c6d6;border-radius:400px 400px 40px 40px}
.stripes{position:absolute;left:0;right:0;bottom:0;height:120px;background:repeating-linear-gradient(90deg,#46161d 0 44px,#b3c6d6 44px 88px)}
.phone{position:absolute;left:50%;top:700px;width:380px;height:800px;margin-left:-190px;border-radius:60px;background:#1a1012;padding:13px;transform:rotate(-4deg);
 box-shadow:0 40px 70px -20px rgba(70,22,29,.55),0 15px 25px -10px rgba(0,0,0,.35)}
.phone img{width:100%;height:100%;object-fit:cover;object-position:top;border-radius:48px;display:block}
.notch{position:absolute;left:50%;top:28px;width:110px;height:32px;background:#1a1012;border-radius:20px;transform:translateX(-50%)}
.sticker{position:absolute;right:120px;top:1110px;width:200px;height:200px;border-radius:50%;background:#8c2f3c;color:#F4ECDC;display:flex;align-items:center;justify-content:center;text-align:center;transform:rotate(12deg);font-family:'Instrument Serif';font-style:italic;font-size:38px;line-height:1;box-shadow:0 10px 20px -8px rgba(0,0,0,.4)}
.sticker b{font-family:'Bricolage Grotesque';font-style:normal;font-weight:800;font-size:22px;letter-spacing:.12em;display:block;margin-top:6px}
.note{position:absolute;left:70px;top:760px;font-family:Caveat;font-size:42px;color:#8c2f3c;transform:rotate(-8deg);line-height:1}
.feat{position:absolute;left:80px;right:80px;top:1520px;display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.feat span{font-family:'Bricolage Grotesque';font-weight:500;font-size:24px;padding:10px 20px;border:2px solid #46161d;border-radius:99px;background:#fffaf0}
.cta{position:absolute;left:0;right:0;top:1440px;display:none}
.grain{position:absolute;inset:0;opacity:.08;mix-blend-mode:multiply;pointer-events:none}
</style></head><body>
<div class="stripes"></div><div class="arch"></div>
<div class="logo">Invitto<small>INVITACIONES DIGITALES</small></div>
<div class="h">tu boda,<br><em>en un</em> <span class="hl">link</span></div>
<div class="note">sin imprimir,<br>sin perder<br>ninguna ↘</div>
<div class="phone"><img src="invitto-muestra.png"><div class="notch"></div></div>
<div class="sticker"><div>100%<br>a tu medida<b>BODAS · XV</b></div></div>
<div class="feat"><span>✓ confirmación por WhatsApp</span><span>📍 mapa</span><span>dress code</span><span>mesa de regalos</span></div>
<svg class="grain" width="1080" height="1920"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
</body></html>

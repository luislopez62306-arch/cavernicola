<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Pinyon+Script&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1350px;overflow:hidden;position:relative;background:#F4ECDC;color:#46161d}
.logo{position:absolute;left:80px;top:70px;font-family:'Pinyon Script';font-size:84px;line-height:1;color:#46161d}
.logo small{font-family:'Bricolage Grotesque';font-size:18px;letter-spacing:.35em;display:block;margin-top:2px;margin-left:8px;color:#7a4a52}
.h{position:absolute;left:80px;top:250px;width:560px;font-family:'Bricolage Grotesque';font-weight:800;font-size:128px;line-height:.92;letter-spacing:-.045em}
.h em{font-family:'Instrument Serif';font-weight:400;font-style:italic;letter-spacing:-.01em;color:#8c2f3c}
.h .hl{background:linear-gradient(transparent 60%,#b3c6d6 60%,#b3c6d6 92%,transparent 92%)}
.sub{position:absolute;left:80px;top:580px;width:470px;font-family:'Bricolage Grotesque';font-weight:500;font-size:31px;line-height:1.35;color:#5a3a40}
.feat{position:absolute;left:80px;top:760px;width:500px;display:flex;flex-wrap:wrap;gap:14px}
.feat span{font-family:'Bricolage Grotesque';font-weight:500;font-size:25px;padding:12px 22px;border:2px solid #46161d;border-radius:99px;background:#fffaf0}
.cta{position:absolute;left:80px;bottom:100px;display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.cta b{font-family:'Bricolage Grotesque';font-weight:800;font-size:32px;background:#46161d;color:#F4ECDC;padding:24px 40px;border-radius:99px}
.cta i{font-family:Caveat;font-style:normal;font-size:40px;color:#8c2f3c;transform:rotate(-4deg)}
.phone{position:absolute;right:70px;top:170px;width:420px;height:880px;border-radius:64px;background:#1a1012;padding:14px;transform:rotate(5deg);
 box-shadow:0 2px 0 #3a2a2c inset,0 40px 70px -20px rgba(70,22,29,.55),0 15px 25px -10px rgba(0,0,0,.35)}
.phone img{width:100%;height:100%;object-fit:cover;object-position:top;border-radius:52px;display:block}
.notch{position:absolute;left:50%;top:30px;width:120px;height:34px;background:#1a1012;border-radius:20px;transform:translateX(-50%)}
.blob{position:absolute;right:-120px;top:120px;width:640px;height:900px;background:#b3c6d6;border-radius:320px 320px 40px 40px}
.stripes{position:absolute;right:0;bottom:0;width:520px;height:110px;background:repeating-linear-gradient(90deg,#46161d 0 38px,#b3c6d6 38px 76px)}
.sticker{position:absolute;right:390px;top:930px;width:190px;height:190px;border-radius:50%;background:#8c2f3c;color:#F4ECDC;display:flex;align-items:center;justify-content:center;text-align:center;transform:rotate(-12deg);font-family:'Instrument Serif';font-style:italic;font-size:36px;line-height:1;box-shadow:0 10px 20px -8px rgba(0,0,0,.4)}
.sticker b{font-family:'Bricolage Grotesque';font-style:normal;font-weight:800;font-size:22px;letter-spacing:.12em;display:block;margin-top:6px}
.grain{position:absolute;inset:0;opacity:.08;mix-blend-mode:multiply;pointer-events:none}
.web{position:absolute;right:80px;bottom:60px;font-family:'Bricolage Grotesque';font-size:24px;color:#F4ECDC;background:#46161d;padding:8px 16px;border-radius:8px}
</style></head><body>
<div class="blob"></div><div class="stripes"></div>
<div class="logo">Invitto<small>INVITACIONES DIGITALES</small></div>
<div class="h">tu boda,<br><em>en un</em> <span class="hl">link</span></div>
<div class="sub">Diseño de ilustrador, en el celular de todos tus invitados. Sin imprimir y sin que se pierda ninguna.</div>
<div class="feat"><span>✓ confirmación por WhatsApp</span><span>📍 mapa</span><span>dress code</span><span>mesa de regalos</span></div>
<div class="cta"><i>¡quedan pocos lugares este mes!</i><b>Mándanos mensaje →</b></div>
<div class="phone"><img src="invitto-muestra.png"><div class="notch"></div></div>
<div class="sticker"><div>100%<br>a tu medida<b>BODAS · XV</b></div></div>
<svg class="grain" width="1080" height="1350"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
</body></html>

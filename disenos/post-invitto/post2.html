<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=Jost:wght@500&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1350px;position:relative;overflow:hidden;background:url(bodas.png) center/cover}
.a{position:absolute}
.shade{inset:0;background:linear-gradient(180deg,rgba(10,6,6,.55) 0%,rgba(10,6,6,0) 26%,rgba(0,0,0,0) 72%,rgba(245,238,228,.0) 100%)}
.cap{left:70px;top:64px;font:500 18px Jost;letter-spacing:.42em;color:#f4ece0;opacity:.85}
.t{left:64px;top:104px;font-family:'Bodoni Moda';font-size:92px;line-height:.95;color:#f6efe4;letter-spacing:-.01em}
.t i{font-style:italic}
.foot{left:0;right:0;bottom:0;height:150px;background:#f4ede2;display:flex;align-items:center;justify-content:space-between;padding:0 70px;border-top:1px solid #1a1a1a}
.foot .l{font-family:'Bodoni Moda';font-size:40px;color:#111}
.foot .l i{font-style:italic}
.foot .r{font-family:'Pinyon Script';font-size:56px;color:#111}
.grain{inset:0;opacity:.08;mix-blend-mode:multiply;pointer-events:none}
</style></head><body>
<div class="a shade"></div>
<div class="a cap">SHE SAID YES</div>
<div class="a t">dijo que <i>sí.</i></div>
<div class="a foot"><div class="l">la invitación, <i>nosotros.</i></div><div class="r">Invitto</div></div>
<svg class="a grain" width="1080" height="1350"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
</body></html>

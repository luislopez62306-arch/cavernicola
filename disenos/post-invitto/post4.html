<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Jost:wght@500;600&family=Pinyon+Script&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1350px;position:relative;overflow:hidden;background:#5a1018;color:#f6ece6}
.a{position:absolute}
.glow{left:140px;top:420px;width:800px;height:700px;border-radius:50%;background:#a3314a;filter:blur(150px);opacity:.5}
.cap{left:0;right:0;top:90px;text-align:center;font:500 20px Jost;letter-spacing:.4em;opacity:.8}
.t{left:0;right:0;top:130px;text-align:center;font-family:'Instrument Serif';font-size:104px;line-height:.95}
.t i{color:#f3c6cf}
.ph{width:290px;height:610px;border-radius:46px;background:#140708;padding:9px;box-shadow:0 40px 60px -25px rgba(0,0,0,.7)}
.ph div{width:100%;height:100%;border-radius:38px;background-size:cover;background-position:center top;position:relative}
.ph div:after{content:'';position:absolute;inset:0;border-radius:38px;background:linear-gradient(115deg,rgba(255,255,255,.14),rgba(255,255,255,0) 35%)}
.isl{position:absolute;left:50%;top:14px;width:80px;height:22px;background:#000;border-radius:14px;transform:translateX(-50%);z-index:2}
.lab{width:78px;height:78px;border-radius:50%;background:#f6ece6;color:#5a1018;font:600 38px Jost;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 18px rgba(0,0,0,.35)}
.hand{left:0;right:0;top:1150px;text-align:center;font-family:Caveat;font-size:52px;color:#f3c6cf}
.lg{left:80px;bottom:50px;font-family:'Pinyon Script';font-size:52px}
.ig{right:80px;bottom:66px;font:500 18px Jost;letter-spacing:.36em;opacity:.75}
.grain{inset:0;opacity:.07;mix-blend-mode:screen;pointer-events:none}
</style></head><body>
<div class="a glow"></div>
<div class="a cap">PARA TU FIESTA</div>
<div class="a t">¿cuál <i>eliges?</i></div>
<div class="a ph" style="left:60px;top:430px;transform:rotate(-7deg)"><span class="isl"></span><div style="background-image:url(ger-wall.jpg)"></div></div>
<div class="a ph" style="left:395px;top:380px;z-index:2"><span class="isl"></span><div style="background-image:url(w-ana.jpg)"></div></div>
<div class="a ph" style="left:730px;top:430px;transform:rotate(7deg)"><span class="isl"></span><div style="background-image:url(w-anahi.jpg)"></div></div>
<div class="a lab" style="left:166px;top:1040px">A</div>
<div class="a lab" style="left:501px;top:1010px;z-index:3">B</div>
<div class="a lab" style="left:836px;top:1040px">C</div>
<div class="a hand">comenta tu letra 💌</div>
<div class="a lg">Invitto</div>
<div class="a ig">INVITACIONES DIGITALES</div>
<svg class="a grain" width="1080" height="1350"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
</body></html>

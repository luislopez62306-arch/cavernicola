<!doctype html><html><head><meta charset="utf-8">

<style>
*{margin:0;box-sizing:border-box}body{background:#ddd;display:flex;gap:40px;padding:40px;width:max-content}
.ab{width:1080px;height:1350px;position:relative;overflow:hidden}
.ab>svg.full{position:absolute;inset:0}
.grain{position:absolute;inset:0;opacity:.09;mix-blend-mode:multiply;pointer-events:none}
/* 1 groovy */
#a{background:#FBF1DE}
#a .t{position:absolute;left:0;right:0;top:400px;text-align:center;font-family:Shrikhand;font-size:168px;line-height:.92;color:#E76F51;text-shadow:7px 7px 0 #5B3A29;transform:rotate(-4deg)}
#a .s{position:absolute;left:0;right:0;top:800px;text-align:center;font-family:'DM Sans';font-weight:700;font-size:30px;letter-spacing:.25em;color:#5B3A29}
#a .pill{position:absolute;left:50%;top:870px;transform:translateX(-50%) rotate(2deg);background:#6A994E;color:#FBF1DE;font-family:'DM Sans';font-weight:700;font-size:28px;padding:18px 40px;border-radius:99px;border:3px solid #5B3A29;box-shadow:5px 5px 0 #5B3A29}
/* 2 coquette */
#b{background:#FCE8EE}
#b .k{position:absolute;left:0;right:0;top:330px;text-align:center;font-family:'DM Sans';font-weight:500;font-size:24px;letter-spacing:.4em;color:#9d4a62}
#b .t{position:absolute;left:0;right:0;top:400px;text-align:center;font-family:Fraunces;font-style:italic;font-size:150px;line-height:.95;color:#5E3A45;font-weight:400}
#b .sc{position:absolute;left:0;right:0;top:640px;text-align:center;font-family:Sacramento;font-size:150px;color:#C9184A;transform:rotate(-5deg)}
#b .list{position:absolute;left:250px;top:900px;font-family:Fraunces;font-style:italic;font-size:38px;line-height:1.75;color:#5E3A45}
/* 3 collage */
#c{background:#E9DCC4}
#c .pol{position:absolute;left:170px;top:250px;width:600px;height:700px;background:#fffdf8;padding:36px 36px 140px;transform:rotate(-5deg);box-shadow:0 18px 30px -12px rgba(60,40,20,.45)}
#c .pol .ph{width:100%;height:100%;background:#7BAFD4;position:relative;overflow:hidden}
#c .cap{position:absolute;bottom:40px;left:0;right:0;text-align:center;font-family:Caveat;font-size:54px;color:#2b2b2b}
#c .let{position:absolute;font-family:'Bagel Fat One';font-size:96px;padding:2px 20px;box-shadow:3px 4px 0 rgba(0,0,0,.18)}
#c .tape{position:absolute;width:190px;height:52px;background:rgba(255,186,73,.75);clip-path:polygon(0 8%,4% 0,8% 10%,12% 0,16% 8%,20% 0,100% 0,96% 12%,100% 25%,96% 40%,100% 55%,96% 70%,100% 85%,96% 100%,0 100%,4% 85%,0 70%,4% 55%,0 40%,4% 25%)}
#c .note{position:absolute;right:70px;bottom:50px;width:330px;background:#fff7a8;padding:34px;font-family:Caveat;font-size:42px;line-height:1.15;color:#333;transform:rotate(4deg);box-shadow:0 12px 20px -10px rgba(0,0,0,.4)}
</style></head><body>
